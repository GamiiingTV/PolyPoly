# ============================================================
#  Le Souffleur — configuration
#  Modifie ce fichier avec le Bloc-notes, puis relance l'outil.
# ============================================================

[jeu]
# Fiche du personnage (donnees/personnages/<nom>.md) et guide de l'univers
# (donnees/univers/<nom>.md). Pour un autre joueur : copie _modele.md.
personnage = "dalibor"
univers = "boheme_1403"

[claude]
# Modèle qui rédige les répliques.
# "claude-opus-5-5" : la meilleure qualité de langue et de rigueur historique.
# "claude-haiku-5-5" : plus rapide et bien moins cher, mais un style moins fin.
modele = "claude-opus-5-5"
# Effort de réflexion : "low" (le plus vif), "medium", "high".
effort = "low"
# Mode rapide d'Opus 5.5 : réponses jusqu'à 2,5x plus rapides, prix doublé.
rapide = false
# Modèle qui tient la chronique (mémoire des personnes et des faits), en arrière-plan.
modele_chroniqueur = "claude-opus-5-5"

[audio]
# Ce qu'on te dit : le son de sortie du PC (le chat vocal du jeu).
# Laisse vide pour la sortie par défaut, ou mets une partie du nom du
# périphérique (ex. "Casque", "CABLE Input"). Lance  lancer.bat --peripheriques
# pour voir la liste.
sortie = ""
# Écouter aussi ton micro, pour que l'outil sache ce que Dalibor a répondu.
ecouter_micro = true
micro = ""
# Anticipation : après ce silence (ms), les répliques sont déjà demandées.
# Si la personne reprend la parole avant `silence_fin_ms`, la phrase est
# complétée et les répliques refaites. 0 = désactivé.
anticipation_ms = 300
# Silence (ms) qui clôt définitivement une réplique.
silence_fin_ms = 700
# Une réplique plus courte que ça est ignorée (toux, bruits).
duree_min_ms = 400
# Sensibilité : combien de fois plus fort que le bruit de fond il faut parler.
# Monte à 4 ou 5 si la musique du jeu déclenche l'écoute.
sensibilite = 3.0

[transcription]
# Modèle Whisper local. "large-v3-turbo" est le meilleur choix sur une bonne carte graphique.
modele = "large-v3-turbo"
# "cuda" (carte NVIDIA) ou "cpu".
appareil = "cuda"
precision = "float16"

[vision]
# Le Souffleur regarde ton écran de jeu, comme s'il était assis à côté de toi.
# Il ne touche jamais ni au clavier ni à la souris.
active = true
# Il cherche la fenêtre dont le titre contient ce texte ; sinon il regarde l'écran n° `ecran`.
titre_fenetre = "Kingdom Come"
ecran = 1
# Images filmées par seconde (gardées en mémoire vive, sur ton PC, ~30 s).
images_par_seconde = 2
# Taille (pixels, côté le plus long) et qualité JPEG des images envoyées à Claude.
# 1920 = ce que tu vois, en détail. 1280 = plus vif et moins cher.
largeur_max = 1920
qualite = 80
# Joindre à chaque demande l'écran du début de la réplique et l'écran actuel.
joindre_aux_repliques = true
# Observateur : décrit la scène en continu (lieu, heure, personnes, tension).
# Il regarde dès que l'image change (au plus toutes les `intervalle_min_s` s),
# tout de suite si elle change brutalement, et au moins toutes les `battement_s` s.
observateur = true
intervalle_min_s = 8
battement_s = 45
modele_observateur = "claude-opus-5-5"

[interface]
nombre_de_choix = 4
opacite = 0.93
largeur = 520
# Touches globales (fonctionnent même quand le jeu a le focus).
touche_afficher = "f8"
touche_regenerer = "f9"
touche_pause = "f10"
